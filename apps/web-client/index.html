<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="WebFlix web client — a composition of the WebFlix application layer with explicit persistence modes: session-only by default, durable by opt-in. Independent value, honestly presented."
    />
    <!-- P6-PWA-1: the web manifest (WF-001's identity law — name/icons/colors,
         display standalone; the icons are honest generated placeholders). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>WebFlix</title>
    <style>
      /*
       * P6-SHELL-RESPONSIVE-1 — the honest core.
       *
       * The shell now carries its own responsive truth (nav flexWrap wrap
       * + 44px touch targets on nav buttons, search controls and ranker
       * labels — pinned by webflix-shell's own geometry tests). The host
       * composes NOTHING for shell geometry anymore; this is the document
       * font only.
       */
      html {
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
