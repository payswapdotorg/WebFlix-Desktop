<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="WebFlix web client — a composition of the WebFlix application layer with explicit persistence modes: session-only by default, durable by opt-in. Independent value, honestly presented."
    />
    <title>WebFlix</title>
    <style>
      /*
       * P6-MOBILE-AUDIT-1 — the host's responsive composition CSS.
       *
       * This is HOST-LEVEL CSS (apps/web-client only): the frozen
       * webflix-shell components style themselves inline
       * (packages/webflix-shell is NOT touched — phase6-clients-plan §2/§8
       * and this order's non-goals). The host composes mobile-viewport
       * overrides on top, exactly like any host composes chrome around a
       * shell. Only properties the shell leaves UNSET are composed here
       * (no !important fights against inline styles):
       *
       * - nav wrapping: the shell's primary nav is a flex row that never
       *   wraps (flexWrap unset inline) — at ~375-430px its six buttons
       *   overflow the document by 126-186px. Wrapping collapses the grid
       *   column's min-content to the viewport.
       * - touch targets (>= 44px): the shell's nav buttons (35px at tablet
       *   widths), search input + submit (39px) and ranker option labels
       *   (18px) render below the touch-target bar; min-height composes
       *   cleanly because the shell never sets it inline.
       */
      nav[aria-label="Primary"] {
        flex-wrap: wrap;
      }
      nav[aria-label="Primary"] button {
        min-height: 44px;
      }
      section[aria-label="Search"] input[type="search"] {
        min-height: 44px;
      }
      section[aria-label="Search"] form button[type="submit"] {
        min-height: 44px;
      }
      label[for^="ranker-adapter-option-"] {
        display: flex;
        align-items: center;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
