<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WebFlix mark">
  <!--
    WebFlix product icon — the SINGLE source mark for the product icon set.

    P9-UI-1 (order requirement 2): an original WebFlix mark — the "Fx"
    stream-forward monogram (an F drawn as ascending signal strokes, an x
    ligature, and a play chevron) in the WebFlix brand accent (#2fd6b3, the
    webflix-shell theme accent) on the shell background (#0f1420, the
    webflix-shell theme background). It is deliberately NOT the ZCode "Z"
    glyph and NOT a YouTube play-button pastiche (ADR-0003 independent-value
    doctrine; the shell theme already bans YouTube red).

    This file is the exact geometry of the renderer mark
    (packages/desktop/src/renderer/src/webflix/brand.ts WEBFLIX_MARK_SVG);
    the raster sizes in icons/ are generated from it — see generate.py and
    README.md in this folder.
  -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f1420"/>
  <path d="M14 22h10.5v4.5H19v3.5h5v4.5h-5v7.5H14z" fill="#2fd6b3"/>
  <path d="M27 22h5.5l3.5 6.5 3.5-6.5H45l-6.5 11 6.9 11.5h-5.7l-3.7-6.7-3.7 6.7H27l6.9-11.5z" fill="#2fd6b3" transform="translate(1 0)"/>
  <path d="M48 24.5l9.5 5.5-9.5 5.5z" fill="#2fd6b3"/>
</svg>
