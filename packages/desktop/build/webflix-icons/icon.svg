<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WebFlix mark">
  <!--
    WebFlix product icon — the SINGLE source mark for the product icon set.

    WFX-WEB-LOOK-1 (operator directive 2026-10-24): the mark is now the
    webflix-2.0 WEB PRODUCT'S OWN LOGO GEOMETRY — the red (#ff0000) rounded
    rect with the white play triangle (webflix-2.0
    src/components/app/logo.tsx / public/favicon.svg) — redrawn on the
    square 64 viewBox this icon set requires. This supersedes the earlier
    teal "Fx" monogram and the no-red visual rule; the ADR-0003
    independent-VALUE doctrine (the in-app notice, the honesty laws) is
    unchanged. It is still NOT the ZCode "Z" glyph (pinned by test).

    This file is the exact geometry of the renderer mark
    (packages/desktop/src/renderer/src/webflix/brand.ts WEBFLIX_MARK_SVG);
    the raster sizes in icons/ are generated from it — see generate.py and
    README.md in this folder.
  -->
  <rect x="2" y="8" width="60" height="48" rx="12" fill="#ff0000"/>
  <path d="M25 22v20l17-10z" fill="#ffffff"/>
</svg>
