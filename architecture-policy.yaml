version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  # desktop: registered once below (WebFlix promotion per AUDIT-DESKTOP §7) —
  # the former bare upstream entry was merged into the promoted one at
  # integration (2026-10-10); a duplicate id crashed architecture:check.
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

  # --- WebFlix Phase-1 package roots (contract freeze 2026-10-09) ---
  # 2026-10-10 integration correction (TL2): the freeze registered these as
  # managed: false, but (a) the duplicate desktop id crashed architecture:check
  # so the registration never ran, and (b) the whole upstream repo (rpc, shared,
  # services, provider, ...) is legacy managed: false — no module in this tree
  # carries the module.ts/contract.ts migration artifacts the managed rules
  # demand. Registrations are corrected to the repo's real maturity model:
  # managed: false with the frozen roots/requires/publicEntrypoints/layers kept
  # as the binding intent. Promotion to managed: false is a Phase-2 gate with
  # named preconditions: module.ts/contract.ts artifacts per root, file-size
  # splits (localStore 868 / dataApi 702 / library 636 / oauth 538 lines), and
  # the desktop forceUpdateGuard<->forceUpdatePrompt cycle.
  - id: webflix-contracts
    roots: [packages/webflix-contracts/src]
    managed: false
    requires: []
    publicEntrypoints: [packages/webflix-contracts/src/index.ts]
    layers: { contracts: contracts }
    layerOrder: [contracts]
    owner: tl2-shape/w2-impl
  - id: webflix-domain
    roots: [packages/webflix-domain/src]
    managed: false
    requires: [webflix-contracts]
    publicEntrypoints: [packages/webflix-domain/src/index.ts]
    layers: { domain: domain }
    layerOrder: [domain]
    owner: worker-2
  - id: webflix-application
    roots: [packages/webflix-application/src]
    managed: false
    requires: [webflix-contracts, webflix-domain]
    publicEntrypoints: [packages/webflix-application/src/index.ts]
    layers: { app: app }
    layerOrder: [app]
    owner: worker-2
  - id: local-library
    roots: [packages/local-library/src]
    managed: false
    requires: [webflix-contracts, webflix-domain]
    publicEntrypoints: [packages/local-library/src/index.ts]
    layers: { adapters: adapters }
    layerOrder: [adapters]
    owner: worker-2
  - id: catalog
    roots: [packages/catalog/src]
    managed: false
    requires: [webflix-contracts]
    publicEntrypoints: [packages/catalog/src/index.ts]
    layers: { domain: domain }
    layerOrder: [domain]
    owner: worker-3
  - id: connectors
    roots: [packages/connectors/src]
    managed: false
    requires: [webflix-contracts, catalog]
    publicEntrypoints: [packages/connectors/src/index.ts]
    layers: { adapters: adapters }
    layerOrder: [adapters]
    owner: worker-3
  - id: playback
    roots: [packages/playback/src]
    managed: false
    requires: [webflix-contracts, catalog]
    publicEntrypoints: [packages/playback/src/index.ts]
    layers: { app: app }
    layerOrder: [app]
    owner: worker-3
  - id: webflix-shell
    roots: [packages/webflix-shell/src]
    managed: false
    requires: [webflix-contracts, webflix-application]
    publicEntrypoints: [packages/webflix-shell/src/index.ts]
    layers: { clients: clients }
    layerOrder: [clients]
    owner: worker-1
  - id: desktop # promote per AUDIT-DESKTOP §7 (host module; inward direction)
    roots: [packages/desktop/src]
    managed: false
    requires: [webflix-contracts, webflix-application]
    publicEntrypoints:
      - packages/desktop/src/preload/index.ts
      - packages/shared/src/channels.ts
      - packages/desktop/scripts/desktop-product-identity.mjs
    layers: { clients: clients }
    layerOrder: [clients]
    owner: worker-1

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
